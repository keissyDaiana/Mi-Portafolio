<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronometro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stopWatch">
        <h1 class="time">00:00:00</h1>
        <div class="controls"></div>
        <img src="pause.png" onclick="stopTimer()" alt="stop">
        <img src="imagen central.png" onclick="startTimer()" alt="start">
        <img src="reinicio (2).png" onclick="resetTimer()" alt="reset">
    </div>
    <script src="script.js"></script>
</body>
</html>
