<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería 3D</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="image-container">

        <span style="--i: 1;">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=85" alt="Montanas junto a un lago al amanecer">
        </span>

        <span style="--i: 2;">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=600&q=85" alt="Lago rodeado de montanas">
        </span>

        <span style="--i: 3;">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600&q=85" alt="Paisaje verde con una casa y montanas">
        </span>

        <span style="--i: 4;">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=85" alt="Cordillera nevada bajo un cielo azul">
        </span>

        <span style="--i: 5;">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=85" alt="Sendero entre arboles de un bosque">
        </span>

        <span style="--i: 6;">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=85" alt="Olas del mar en una playa tropical">
        </span>

        <span style="--i: 7;">
            <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=600&q=85" alt="Montanas reflejadas en un lago tranquilo">
        </span>

        <span style="--i: 8;">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=85" alt="Carretera entre montanas al atardecer">
        </span>

    </div>

    <div class="buttons">
        <button class="btn prev">Anterior</button>
        <button class="btn next">Siguiente</button>
    </div>

    <!-- JS -->
    <script src="script.js"></script>

</body>
</html>
